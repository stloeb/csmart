/* couleurs de badge par type de remontée */
var TYPES = {
  FUNI:"#7C6BE8", TPH:"#7C6BE8", TC:"#3E8FE0", TSDB:"#3FA7C4",
  TSD:"#2E9B68", TS:"#8A8A46", TK:"#9A6438", TLC:"#4A7FC4",

/* ================================================================== */

function $(s){ return document.querySelector(s); }
function pad(n){ return (n<10?"0":"")+n; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function etatCls(e){ return e === "F" ? " f" : (e === "P" ? " w" : ""); }

function ligneRM(o){
  var col = TYPES[o.ty] || "#5B6B7E";
  return '<div class="ln' + (o.e === "F" ? " f" : "") + '">' +
    '<span class="ty" style="background:' + col + '">' + esc(o.ty) + '</span>' +
    '<span class="nm">' + esc(o.nm) + '</span>' +
    (o.no ? '<span class="no">' + esc(o.no) + '</span>' : '') +
    '<span class="hr">' + esc(o.hr) + '</span>' +
    '<span class="st' + etatCls(o.e) + '"></span></div>';
}

var PISTE_COL = { v:"var(--vert)", b:"var(--bleu)", r:"var(--rouge)", n:"var(--noir)", k:"var(--kl)" };

function lignePiste(o){
  return '<div class="ln' + (o.e === "F" ? " f" : "") + '">' +
    '<span class="pc" style="background:' + (PISTE_COL[o.c] || "#3E4C5E") + '"></span>' +
    '<span class="nm">' + esc(o.nm) + '</span>' +
    (o.no ? '<span class="no">' + esc(o.no) + '</span>' : '') +
    '<span class="hr">' + esc(o.hr) + '</span>' +
    '<span class="st' + etatCls(o.e) + '"></span></div>';
}

function entete(titre, ouv, tot, mot){
  var z = (ouv === 0) ? " zero" : "";
  return '<div class="bh"><b>' + esc(titre) + '</b>' +
    '<span class="r' + z + '">' + ouv + '<u>/' + tot + '</u>' +
    '<span>' + esc(mot) + '</span></span></div>';
}

function sousTitre(txt, ouv, tot){
  var p = tot ? Math.round(ouv / tot * 100) : 0;
  return '<div class="sh">' + esc(txt) + ' · ' + ouv + '/' + tot + '</div>' +
         '<div class="bar"><i style="width:' + p + '%"></i></div>';
}

function blocGenerique(b){
  var h = '<div class="blk">', i, j, sec, tot = 0, ouv = 0, mot = "éléments";
  for (i = 0; i < b.sections.length; i++){ tot += b.sections[i].tot; ouv += b.sections[i].ouv; }
  if (b.sections.length && /remont/i.test(b.sections[0].titre)) mot = "remontées";
  else if (b.sections.length && /piste/i.test(b.sections[0].titre)) mot = "ouverts";
  h += entete(b.nom, b.sections[0].ouv, b.sections[0].tot, mot);
  for (i = 0; i < b.sections.length; i++){
    sec = b.sections[i];
    h += sousTitre(b.nom + " · " + sec.titre.toLowerCase(), sec.ouv, sec.tot);
    for (j = 0; j < sec.items.length; j++){
      h += sec.items[j].ty ? ligneRM(sec.items[j]) : lignePiste(sec.items[j]);
    }
  }
  return h + '</div>';
}

/* Répartition en trois colonnes : on empile en cherchant à équilibrer
   les hauteurs, estimées au nombre de lignes de chaque bloc. */
function repartir(blocs){
  var cols = [[], [], []], hauteurs = [0, 0, 0], i, j, n, mini;
  for (i = 0; i < blocs.length; i++){
    n = 3;
    for (j = 0; j < blocs[i].sections.length; j++) n += blocs[i].sections[j].items.length + 2;
    mini = 0;
    for (j = 1; j < 3; j++) if (hauteurs[j] < hauteurs[mini]) mini = j;
    cols[mini].push(blocs[i]);
    hauteurs[mini] += n;
  }
  return cols;
}

function rendreCorps(){
  var cols = repartir(DATA.blocs || []), h = "", i, j;
  for (i = 0; i < cols.length; i++){
    h += '<div class="col">';
    for (j = 0; j < cols[i].length; j++) h += blocGenerique(cols[i][j]);
    h += '</div>';
  }
  $("#doc").innerHTML = h;
}

function rendre(){
  var h, i, c, z;

  $("#ecu").innerHTML = esc(DATA.ecusson || "");
  $("#titre").innerHTML = esc(DATA.station || "");
  $("#soustitre").innerHTML = esc(DATA.soustitre || "");

  h = "";
  for (i = 0; i < (DATA.hero || []).length; i++){
    c = DATA.hero[i];
    h += '<div class="hc"><div class="k">' + esc(c.k) + '</div>' +
         '<div class="v ' + (c.c || "") + '">' + esc(c.v) + '</div>' +
         '<div class="l">' + esc(c.l) + '</div></div>';
  }
  $("#hero").innerHTML = h;

  h = "";
  for (i = 0; i < (DATA.compteurs || []).length; i++){
    c = DATA.compteurs[i];
    z = (c.ouv === 0) ? " zero" : "";
    h += '<div class="cb"><span class="cdot"><i class="' + (c.p || "") + '"></i></span>' +
         '<span class="t"><b class="' + z + '">' + c.ouv + '<u>/' + c.tot + '</u></b>' +
         '<i>' + esc(c.l) + '</i></span></div>';
  }
  $("#cnt").innerHTML = h;

  rendreCorps();
  fraicheur();
  preparerDefilement();
}

/* ---------- défilement automatique ----------
   Un téléviseur n'a ni souris ni barre de défilement : la page avance
   seule, écran par écran, avec un léger recouvrement pour qu'aucune
   ligne ne soit sautée entre deux positions. */

var etapes = [], pos = 0, tempo = null, fige = false;
var HVUE = 452;

function preparerDefilement(){
  var doc = $("#doc"), hDoc = doc.offsetHeight, max = Math.max(0, hDoc - HVUE);
  var pas = HVUE - CONFIG.recouvrement, y = 0;
  etapes = [0];
  while (y + pas < max){ y += pas; etapes.push(y); }
  if (max > 0 && etapes[etapes.length - 1] !== max) etapes.push(max);
  pos = 0;
  placer(0, 0);
  planifier(CONFIG.pause + 2000);
}

function placer(y, duree){
  var d = $("#doc"), max = etapes[etapes.length - 1] || 1;
  d.style.webkitTransition = duree ? ("-webkit-transform " + duree + "ms ease-in-out") : "none";
  d.style.transition = duree ? ("transform " + duree + "ms ease-in-out") : "none";
  d.style.webkitTransform = "translateY(-" + y + "px)";
  d.style.transform = "translateY(-" + y + "px)";
  $("#sbar").style.width = (y / max * 100) + "%";
}

function planifier(d){ if (tempo) clearTimeout(tempo); tempo = setTimeout(suivant, d); }

function suivant(){
  if (fige) return;
  pos = (pos + 1) % etapes.length;
  if (pos === 0){ placer(0, 700); planifier(700 + CONFIG.pause + 2000); return; }
  placer(etapes[pos], CONFIG.glissement);
  planifier(CONFIG.glissement + CONFIG.pause);
}

function onKey(e){
  var k = e.keyCode || e.which;
  if (k === 38 || k === 37){ pos = (pos - 2 + etapes.length) % etapes.length; suivant(); }
  else if (k === 40 || k === 39){ suivant(); }
  else if (k === 13 || k === 32){
    fige = !fige;
    if (fige){ if (tempo) clearTimeout(tempo); } else planifier(300);
  } else return;
  if (e.preventDefault) e.preventDefault();
}

/* ---------- bandeau ---------- */
var JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var MOIS = ["janvier","février","mars","avril","mai","juin","juillet",
            "août","septembre","octobre","novembre","décembre"];

function fraicheur(){
  var e = $("#maj"), d, min;
  if (!DATA.maj){ e.innerHTML = "Mise à jour inconnue"; e.className = "bmaj old"; return; }
  d = new Date(String(DATA.maj).replace(" ", "T"));
  min = Math.round((new Date().getTime() - d.getTime()) / 60000);
  e.innerHTML = "Mis à jour le <b>" + JOURS[d.getDay()] + " " + d.getDate() + " " +
    MOIS[d.getMonth()] + " " + d.getFullYear() + " — " + pad(d.getHours()) + ":" + pad(d.getMinutes()) +
    "</b><br>Source : <b>" + esc(DATA.source) + "</b>";
  e.className = (min > CONFIG.alerteFraicheurMin) ? "bmaj old" : "bmaj";
}

function ajuster(){
  var w = window.innerWidth || 1280, h = window.innerHeight || 720;
  var k = Math.min(w / 1280, h / 720), tv = document.getElementById("tv");
  tv.style.webkitTransform = "scale(" + k + ")";
  tv.style.transform = "scale(" + k + ")";
  tv.style.left = Math.round((w - 1280 * k) / 2) + "px";
  tv.style.top = Math.round((h - 720 * k) / 2) + "px";
}

/* ---------- alimentation ----------
   En cas d'échec, les dernières données restent affichées : sur un
   téléviseur, une donnée d'hier vaut mieux qu'un écran vide, à condition
   que l'heure de mise à jour le signale — d'où le passage en orange. */
function charger(apres){
  if (!window.XMLHttpRequest || CONFIG.demo){ if (apres) apres(); return; }
  var x = new XMLHttpRequest();
  x.open("GET", "bulletin.json?t=" + new Date().getTime(), true);
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    if (x.status === 200){ try { DATA = JSON.parse(x.responseText); } catch (err) {} }
    if (apres) apres();
  };
  x.send(null);
}

(function init(){
  if (!CONFIG.demo) $("#demo").className = "demo hide";
  ajuster();
  setInterval(fraicheur, 60000);
  charger(rendre);
  setInterval(function(){ charger(rendre); }, CONFIG.rafraichir);
  if (window.addEventListener){
    window.addEventListener("resize", ajuster, false);
    document.addEventListener("keydown", onKey, false);
  }
})();
</script>
