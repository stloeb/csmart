# CSMART Weather — rafraîchissement du bulletin du domaine
#
# À placer dans .github/workflows/bulletin.yml
#
# Arborescence attendue, à la racine du dépôt :
#   index.html
#   bulletin.json
#   scripts/fetch-bulletin.mjs
#   .github/workflows/bulletin.yml
#
# Deux limites à connaître :
#   · les tâches planifiées de GitHub sont exécutées « au mieux » et
#     accusent souvent dix à vingt minutes de retard. Sans conséquence
#     pour un bulletin de domaine skiable.
#   · une planification s'éteint après soixante jours sans activité sur
#     le dépôt. Ce job commitant à chaque exécution, il s'auto-entretient.

name: Bulletin du domaine

on:
  schedule:
    - cron: "*/30 5-20 * * *"   # toutes les 30 min, 5h–20h UTC
  workflow_dispatch:            # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  rafraichir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm install cheerio --no-save

      - name: Récupérer le bulletin
        id: fetch
        run: node scripts/fetch-bulletin.mjs
        continue-on-error: true   # un échec ne doit pas écraser le fichier valide

      - name: Publier si le bulletin est valide
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name  "csmart-bot"
          git config user.email "bot@users.noreply.github.com"
          # On stage d'abord : sans cela, un bulletin.json encore non suivi
          # par git passerait inaperçu et ne serait jamais publié.
          git add bulletin.json
          if git diff --cached --quiet -- bulletin.json; then
            echo "Bulletin inchangé, rien à publier."
            exit 0
          fi
          git commit -m "Bulletin du domaine — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
          echo "Bulletin publié."

      - name: Signaler l'échec
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::warning::Bulletin non mis à jour. Les écrans conservent la version précédente."
